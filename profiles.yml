# dbt connection profiles — fully driven by environment variables.
#
# The active connection is chosen by DBT_TARGET:
#   DBT_TARGET=local   -> local Postgres running in Docker (docker-compose.yml)
#   DBT_TARGET=server  -> remote Postgres via server-host configuration
#
# All values are loaded from a .env file (see .env.example). Nothing here is
# hardcoded, so the same profile works across every environment.
#
# Point dbt at this file with:  DBT_PROFILES_DIR=.  (set in .env / Makefile)

cbt_test_analytics:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:

    # ---- LOCAL: Postgres in Docker -------------------------------------
    local:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER', 'dbt') }}"
      password: "{{ env_var('PG_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('PG_DATABASE', 'analytics') }}"
      schema: "{{ env_var('PG_SCHEMA', 'public') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      sslmode: "{{ env_var('PG_SSLMODE', 'disable') }}"
      keepalives_idle: 0
      connect_timeout: 10
      retries: 1

    # ---- SERVER: remote Postgres host ----------------------------------
    server:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      port: "{{ env_var('PG_PORT', '5432') | int }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      dbname: "{{ env_var('PG_DATABASE') }}"
      schema: "{{ env_var('PG_SCHEMA', 'public') }}"
      threads: "{{ env_var('DBT_THREADS', '8') | int }}"
      sslmode: "{{ env_var('PG_SSLMODE', 'require') }}"
      keepalives_idle: 0
      connect_timeout: 30
      retries: 2
