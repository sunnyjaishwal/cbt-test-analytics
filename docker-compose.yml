# Local Postgres for dbt development.
# Reads the same variables as dbt (from .env), so there is a single source
# of truth for the local connection.
#
#   docker compose up -d      # start
#   docker compose down       # stop  (add -v to wipe data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cbt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-dbt}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dbt}
      POSTGRES_DB: ${PG_DATABASE:-analytics}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files placed here run once on first container init (ordered).
      - ./config/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dbt} -d ${PG_DATABASE:-analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: cbt_pgdata
