version: 2

models:
  - name: alloy_geo
    description: "Cleaned & conformed geography: standardized casing, boolean coverage flags, parsed spellings."
    columns:
      - name: geo_key
        data_tests: [unique, not_null]
      - name: geo_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["CITY", "STATE", "REGION"]
      - name: geo_zone
        data_tests:
          - accepted_values:
              arguments:
                values: ["NORTH", "SOUTH_WEST", "SOUTH_EAST", "SOUTH_SOUTH"]
